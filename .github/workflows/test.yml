name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/markdown_to_notion.py examples/source.example.md --parent-page-id demo --dry-run
      - run: python scripts/verify_markdown.py examples/source.example.md examples/source.example.md --report /tmp/conversion-validation.json
